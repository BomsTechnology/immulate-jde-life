<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="./login.css" rel="stylesheet" />
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<div class="card">
  <div class="logo">Accès<span>·</span>Privé</div>
  <p class="subtitle">Connectez-vous pour accéder à vos fichiers JDE</p>

  <div class="field">
    <label>Identifiant</label>
    <input type="text" id="username" placeholder="Entrez votre identifiant" autocomplete="username">
  </div>

  <div class="field">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="Entrez votre mot de passe" autocomplete="current-password">
  </div>

  <button onclick="login()">Se connecter →</button>

  <div class="error" id="error">Identifiants incorrects. Réessayez.</div>

  <p class="hint">Demo : <code>admin</code> / <code>1234</code></p>
</div>

<script>
  // ── Identifiants autorisés ──────────────────────
  const USERS = {
    "admin": "1234",
    "alice": "motdepasse",
    "bob":   "azerty123"
  };
  // ───────────────────────────────────────────────

  function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const error    = document.getElementById('error');

    if (USERS[username] && USERS[username] === password) {
      // Stocker la session et rediriger
      sessionStorage.setItem('auth', 'true');
      sessionStorage.setItem('user', username);
      window.location.href = 'jde-download.html';
    } else {
      error.classList.remove('show');
      void error.offsetWidth; // reset animation
      error.classList.add('show');
    }
  }

  // Connexion via touche Entrée
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
