<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Téléchargement</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="./download.css" rel="stylesheet" />
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<div class="card">
  <p class="welcome">✓ Connecté</p>
  <h1>Vos fichiers</h1>
  <p class="desc">Bienvenue, <strong id="username-display"></strong>.<br>Téléchargez vos fichiers ci-dessous.</p>

  <!-- ── Fichiers à télécharger — modifiez href et les infos ── -->

  <div class="file-card">
    <div class="file-icon">📊</div>
    <div class="file-info">
      <div class="file-name">Rapport 2024.xlsx</div>
      <div class="file-size">Excel — 870 Ko</div>
    </div>
    <a class="btn-dl" href="EXTRACTION-LIFE.xls" download>↓ Télécharger</a>
  </div>
  <!-- ─────────────────────────────────────────────────────────── -->

  <p class="logout">Pas vous ? <a href="life.html" onclick="logout()">Se déconnecter</a></p>
</div>

<script>
  // Vérifier la session
  if (sessionStorage.getItem('auth') !== 'true') {
    window.location.href = 'life.html';
  }

  // Afficher le nom de l'utilisateur
  const user = sessionStorage.getItem('user');
  document.getElementById('username-display').textContent = user || 'utilisateur';

  function logout() {
    sessionStorage.clear();
  }
</script>
</body>
</html>
